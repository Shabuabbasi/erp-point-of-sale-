services:
  # Backend API only
  - type: web
    name: superstore-erp-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TAX_RATE
        value: 0
      - key: CLIENT_URL
        value: https://erp-point-of-sale.onrender.com
    healthCheckPath: /

  # Frontend static site
  - type: web
    name: erp-point-of-sale
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://superstore-erp-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
