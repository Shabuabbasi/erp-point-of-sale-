services:
  # Backend API
  - type: web
    name: superstore-erp-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TAX_RATE
        value: 0
      - key: CLIENT_URL
        value: https://superstore-erp.onrender.com
    healthCheckPath: /

  # Frontend (Static Site)
  - type: web
    name: superstore-erp
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://superstore-erp-api.onrender.com/api
    routes:
      # Proxy API calls to backend (must be BEFORE the SPA catch-all)
      - type: rewrite
        source: /api/*
        destination: https://superstore-erp-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
